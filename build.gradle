// Root project has no source of its own — "common" is a plain source
// directory that each platform subproject (fabric/, neoforge/) adds to its
// own sourceSet and compiles against its own Minecraft dependency.
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    dependencies {
        // Minecraft 1.21.1 doesn't ship jspecify; the shared code's @NonNull needs it.
        compileOnly 'org.jspecify:jspecify:1.0.0'

        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    tasks.named('jar') {
        inputs.property "archivesName", base.archivesName

        from(rootProject.file("LICENSE")) {
            rename { "${it}_${inputs.properties.archivesName}" }
        }
    }

    // configure the maven publication
    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
