plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

// Root project has no source of its own — "common" is a plain source
// directory that each platform subproject (fabric/, neoforge/) adds to its
// own sourceSet and compiles against its own Minecraft dependency.
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    tasks.named('jar') {
        inputs.property "archivesName", base.archivesName

        from(rootProject.file("LICENSE")) {
            rename { "${it}_${inputs.properties.archivesName}" }
        }
    }

    // configure the maven publication
    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// Release publishing lives in the root project so every loader shares one
// release note, version and set of project IDs.
def releaseNotesFor = { String v ->
    // Player-facing notes win; CHANGELOG.md is developer-facing and only the fallback.
    def playerNotes = file(".github/release-notes/${v}.md")
    if (playerNotes.exists()) return playerNotes.text.trim()
    def m = file('CHANGELOG.md').text =~ /(?ms)^## \[${java.util.regex.Pattern.quote(v)}\][^\n]*\n(.*?)(?=^## \[|\z)/
    // Fail instead of publishing an empty release note.
    if (!m.find()) throw new GradleException("No release notes: add .github/release-notes/${v}.md or a '## [${v}]' section to CHANGELOG.md")
    m.group(1).trim()
}

publishMods {
    // Lazy: a plain `./gradlew build` must not need release notes.
    changelog = providers.provider { releaseNotesFor(mod_version) }
    version = mod_version
    type = STABLE

    def mrOptions = modrinthOptions {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        // Without a token, still exercise the whole task graph and write the
        // assets to build/ instead of failing or uploading.
        dryRun = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null
    }
    def cfOptions = curseforgeOptions {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        // CurseForge rejects a file with no environment declared. The mod does its work on the
        // server; a client install only adds the config screen, so the files are marked server-only.
        client = false
        server = true
        dryRun = providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null
    }

    // One pair of blocks per loader subproject; display names match the ones already on Modrinth.
    modrinth('modrinthFabric') {
        from mrOptions
        displayName = "${mod_display_name} Fabric"
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api')
        optional('modmenu')
    }
    curseforge('curseforgeFabric') {
        from cfOptions
        displayName = "${mod_display_name} Fabric"
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api')
        optional('modmenu')
    }
    modrinth('modrinthNeoforge') {
        from mrOptions
        displayName = "${mod_display_name} NeoForge"
        file project(':neoforge')
        modLoaders.add('neoforge')
    }
    curseforge('curseforgeNeoforge') {
        from cfOptions
        displayName = "${mod_display_name} NeoForge"
        file project(':neoforge')
        modLoaders.add('neoforge')
    }
}
