plugins {
	id 'net.neoforged.moddev' version '2.0.147'
}

sourceSets {
	main {
		java {
			srcDir rootProject.file('common/src/main/java')
		}
		resources {
			srcDir rootProject.file('common/src/main/resources')
		}
	}
	test {
		java {
			srcDir rootProject.file('common/src/test/java')
		}
	}
}

neoForge {
	// To change the version see the gradle.properties file
	version = rootProject.neoforge_version

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		nocroptrample {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}
