name: Check release secrets

# Manual and read-only: nothing is published. An empty POST to Modrinth's version
# endpoint is authenticated before its body is read, so 400 means the token is
# valid and may create versions, while 401 means it is invalid, expired or lacks
# the permission. (GET /v2/user is not used: it needs a scope releases don't need.)
on:
  workflow_dispatch:

jobs:
  modrinth:
    runs-on: ubuntu-latest
    steps:
      - name: Check MODRINTH_TOKEN
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::MODRINTH_TOKEN is not set"; exit 1
          fi
          case "$MODRINTH_TOKEN" in
            *[[:space:]]*) echo "::error::MODRINTH_TOKEN contains whitespace"; exit 1 ;;
          esac
          echo "Token length: ${#MODRINTH_TOKEN}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: murqin/NoCropTrample release-secret-check" \
            https://api.modrinth.com/v2/version)
          echo "Modrinth answered HTTP $code"
          if [ "$code" != "400" ]; then
            echo "::error::Expected 400 (authenticated, empty body); got $code. 401 means an invalid token or a missing permission."
            exit 1
          fi
          echo "Token is valid and may create versions."
